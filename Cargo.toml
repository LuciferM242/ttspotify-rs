[package]
name = "tt-spotify-bot"
version = "0.7.0"
edition = "2021"
default-run = "tt-spotify-bot"
license = "GPL-3.0-or-later"

[dependencies]
# TeamTalk SDK. Fork of BlindMaster24/TeamTalkRust; the `arm64-linux` branch
# adds aarch64 SDK downloading (upstream only fetches win64 + x86_64).
teamtalk = { git = "https://github.com/LuciferM242/TeamTalkRust.git", branch = "arm64-linux", features = ["logging"] }

# Spotify (librespot - native Rust). default-features = false drops the default
# native-tls stack (OpenSSL) in favor of rustls (which the rest of the app
# already uses), and drops librespot-playback's rodio/cpal speaker backend that
# this bot never uses (audio goes to a custom TeamTalkSink, not local output).
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-metadata = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-oauth = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }

# YouTube (rustypipe - GPL-3). Switch its default native-tls to rustls so the
# whole app shares one TLS stack instead of compiling OpenSSL alongside rustls.
# Pinned to git, not the crates.io 0.11.4 release: 0.11.4 panics in
# visitor_data.rs (`.unwrap()` on a failed visitor-data scrape) and, with
# panic = "abort", that killed a user's bot outright. The fix landed upstream
# 2025-06-17 (commit 71712e4, "remove unwrap trying to fetch visitor data") but
# was never published. Rev is repo HEAD; upstream is dead since 2025-06-18.
rustypipe = { git = "https://codeberg.org/ThetaDev/rustypipe", rev = "6035e6db4e613038e14fe775f0d2eae889737d93", default-features = false, features = ["rustls-tls-native-roots"] }

# YouTube audio: HTTP fetch + decode + resample.
# symphonia decodes YouTube's m4a (ISO-MP4 container + AAC). default-features
# = false drops decoders nothing feeds it (adpcm/mkv/pcm/wav); Spotify's
# ogg/vorbis are still pulled in by librespot-playback.
# rubato resamples to the 44.1k pipeline rate.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
symphonia = { version = "0.5", default-features = false, features = ["isomp4", "aac"] }
rubato = "0.16"

# Plugin zip extraction for the YouTube binaries auto-installer + Windows
# release-archive extraction in the self-updater.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Self-updater: verify the minisign signature over SHA256SUMS, swap the running
# binary, decode the Linux/arm .tar.gz release archives, compare semver
# versions, and stream download chunks for progress reporting.
minisign-verify = "0.2"
self-replace = "1"
tar = "0.4"
flate2 = "1"
semver = "1"
futures-util = { version = "0.3", default-features = false }

# SHA-256 verification of downloaded binaries (yt-dlp / bgutil-pot).
sha2 = "0.10"

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }

# Audio
crossbeam-channel = "0.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Config & serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Utilities
regex = "1"
rand = "0.8"
percent-encoding = "2"
clap = { version = "4", features = ["derive"] }
# Shell completions and the man page are generated from the same clap
# definition as --help, so they cannot drift from the real flags.
clap_complete = "4"
clap_mangen = "0.2"
dirs = "6"
parking_lot = "0.12"

# Caching with expiry: search results per user, and search responses keyed by
# query so a repeated search answers from memory instead of the network.
moka = { version = "0.12", features = ["sync"] }

[dev-dependencies]
# Property tests over the queue: the index-drift class of bug that example
# tests keep missing.
proptest = "1"
# Snapshot tests for text the bot prints (queue listing, mode line), so a
# wording change is a reviewable diff instead of a rewritten assertion.
insta = "1"
# Parametrised cases, to collapse near-duplicate queue tests.
rstest = "0.23"
# Fake MediaPlayer implementations, so player dispatch can be tested without a
# Spotify session or a yt-dlp subprocess.
mockall = "0.13"
log = "0.4.33"
tracing-log = "0.2.0"

[profile.release]
strip = true
lto = true
panic = "abort"
# Single codegen unit: with fat LTO already on, this lets the optimizer see the
# whole crate graph as one unit for slightly smaller/faster output. Costs some
# link time (release builds only; debug/check unaffected).
codegen-units = 1

# GUI (Windows tray + config editor)
[target.'cfg(windows)'.dependencies]
# Win32 GUI: the tray icon, menus and dialogs. Thin, safe bindings over the
# Windows API with no transitive dependencies and no build script, replacing
# wxWidgets (which downloaded a prebuilt toolkit and left ~470 MB of build
# artifacts to draw a tray icon and four dialogs).
winsafe = { version = "0.0.28", features = ["gui", "shell"] }
# Per-user autostart via the HKCU Run registry key.
winreg = "0.52"

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1.5"
embed-resource = "3.0.11"

[[bin]]
name = "tt-spotify-bot"
path = "src/main.rs"


[target.'cfg(unix)'.dependencies]
# Only to hand SIGPIPE back to the kernel for commands that print and exit,
# so `--doctor | head` ends quietly instead of panicking.
libc = "0.2"
